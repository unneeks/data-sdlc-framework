# =============================================================================
# Trino Coordinator Configuration — Project ATLAS
# =============================================================================
# Production coordinator settings for the ATLAS lakehouse serving layer.
# Deployed on EKS (r6g.4xlarge instances) in eu-west-2.
# =============================================================================

# --- Node Configuration ---
coordinator=true
node-scheduler.include-coordinator=false
discovery.uri=http://trino-discovery:8080

# --- HTTP Server ---
http-server.http.port=8080
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/tls/keystore.jks
http-server.https.keystore.key=changeit
http-server.process-forwarded=true

# --- Authentication ---
http-server.authentication.type=OAUTH2
http-server.authentication.oauth2.issuer=https://cognito-idp.eu-west-2.amazonaws.com/eu-west-2_AtlasPool
http-server.authentication.oauth2.client-id=atlas-trino-client
http-server.authentication.oauth2.scopes=openid,profile

# --- Query Limits ---
# Prevent runaway queries from impacting production workloads
query.max-execution-time=30m
query.max-run-time=45m
query.max-cpu-time=60m
query.max-stage-count=150
query.max-memory=24GB
query.max-memory-per-node=8GB
query.max-total-memory=48GB
query.max-total-memory-per-node=16GB

# --- Query Queue ---
query.max-queued-queries=500
query.max-concurrent-queries=50

# --- Memory Management ---
memory.heap-headroom-per-node=4GB

# --- Spill Configuration ---
# Spill to local NVMe SSD when memory is exhausted
spill-enabled=true
spiller-spill-path=/mnt/nvme/trino-spill
spiller-max-used-space-threshold=0.85
spiller-threads=8
max-spill-per-node=200GB

# --- Exchange ---
exchange.client-threads=32
exchange.concurrent-request-multiplier=3
exchange.max-buffer-size=64MB
exchange.max-response-size=32MB

# --- Task Management ---
task.max-worker-threads=32
task.min-drivers=16
task.concurrency=32
task.writer-count=4

# --- Resource Groups ---
# Separate pools for reporting, analytics, and ad-hoc queries
resource-groups.configuration-manager=file
resource-groups.config-file=/etc/trino/resource-groups.json

# --- Fault Tolerance ---
retry-policy=TASK
task-retry-attempts-per-task=3
retry-initial-delay=10s
retry-max-delay=1m
retry-delay-scale-factor=2.0

# --- Logging ---
log.path=/var/log/trino
log.max-size=256MB
log.max-history=14
