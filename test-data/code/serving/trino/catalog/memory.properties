# =============================================================================
# Trino Memory Connector Configuration — Project ATLAS
# =============================================================================
# In-memory connector for temporary tables, intermediate query results,
# and ad-hoc analyst workloads. Data is NOT persisted across restarts.
# =============================================================================

connector.name=memory

# --- Memory Limits ---
# Cap memory usage to prevent impact on production Iceberg queries
memory.max-data-per-node=2GB

# --- Thread Configuration ---
memory.splits-per-node=8
