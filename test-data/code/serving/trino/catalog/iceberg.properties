# =============================================================================
# Trino Iceberg Catalog Configuration — Project ATLAS
# =============================================================================
# Connects Trino to Apache Iceberg tables via AWS Glue Metastore.
# Region: eu-west-2 (London) — data residency requirement for UK banking data.
# =============================================================================

connector.name=iceberg

# --- Metastore Configuration ---
# Using AWS Glue as the Hive Metastore-compatible catalog
iceberg.catalog.type=glue
iceberg.glue.catalog-id=123456789012
iceberg.glue.default-warehouse-dir=s3://atlas-lakehouse-prod-eu-west-2/warehouse/

# --- AWS Region ---
# All data must remain in eu-west-2 per data residency policy
hive.metastore.glue.region=eu-west-2

# --- S3 Configuration ---
hive.s3.path-style-access=false
hive.s3.ssl.enabled=true
hive.s3.sse.enabled=true
hive.s3.sse.type=KMS
hive.s3.sse.kms-key-id=alias/atlas-lakehouse-encryption
hive.s3.endpoint=s3.eu-west-2.amazonaws.com

# --- IAM Authentication ---
# Uses instance profile or IRSA (IAM Roles for Service Accounts) in EKS
hive.s3.use-instance-credentials=true

# --- Iceberg-Specific Settings ---
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD
iceberg.target-max-file-size=536870912
iceberg.unique-table-location=true

# --- Table Statistics ---
iceberg.extended-statistics.enabled=true
iceberg.collect-column-statistics-on-write=true

# --- Materialised Views ---
iceberg.materialized-views.enabled=true
iceberg.materialized-views.storage-schema=atlas_lakehouse.mv_storage

# --- Performance ---
# Optimise for large banking datasets (billions of rows)
iceberg.max-partitions-per-writer=512
iceberg.split-size=134217728
iceberg.expire_snapshots.min-retention=7d

# --- Schema Evolution ---
iceberg.add-column-enabled=true
iceberg.drop-column-enabled=false

# --- Register Multiple Databases ---
# raw: Landing zone from CDC/streaming ingestion
# curated: Cleaned, conformed, business-ready tables
# aggregated: Pre-computed aggregations for reporting
# sandbox: Analyst exploration space (restricted PII)
iceberg.register-table-procedure.enabled=true
