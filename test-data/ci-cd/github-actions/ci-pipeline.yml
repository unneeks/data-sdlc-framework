# Project ATLAS — Main CI Pipeline
# Triggered on pull requests to main branch
# Runs linting, unit tests, security scans, and build jobs

name: CI Pipeline

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  SPARK_VERSION: "3.5.0"
  DBT_PROFILES_DIR: ./code/transformation
  PYTHON_DEFAULT: "3.11"

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Lint: Code quality checks across Python, SQL, and Terraform
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (${{ matrix.tool }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [ruff, sqlfluff, tflint]
        include:
          - tool: ruff
            install: pip install ruff==0.5.7
            command: ruff check --output-format=github code/
          - tool: sqlfluff
            install: pip install sqlfluff==3.1.0 sqlfluff-templater-dbt==3.1.0 dbt-glue==1.8.0
            command: sqlfluff lint code/transformation/models/ --dialect athena --format github-annotation
          - tool: tflint
            install: |
              curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
              tflint --init
            command: |
              cd infrastructure/terraform
              tflint --recursive --format compact
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.tool != 'tflint'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Install ${{ matrix.tool }}
        run: ${{ matrix.install }}

      - name: Run ${{ matrix.tool }}
        run: ${{ matrix.command }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Unit Tests: PySpark and dbt tests across Python versions
  # ─────────────────────────────────────────────────────────────────────────────
  unit-test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    services:
      localstack:
        image: localstack/localstack:3.5
        ports:
          - 4566:4566
        env:
          SERVICES: s3,glue,iam
          DEFAULT_REGION: us-east-1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Java (for PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyspark==${{ env.SPARK_VERSION }} delta-spark==3.2.0
          pip install dbt-core==1.8.0 dbt-glue==1.8.0

      - name: Run PySpark unit tests
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://localhost:4566
          SPARK_LOCAL_IP: 127.0.0.1
        run: |
          pytest code/ingestion/tests/ \
            code/transformation/tests/ \
            --junitxml=reports/pyspark-results-${{ matrix.python-version }}.xml \
            --cov=code/ \
            --cov-report=xml:reports/coverage-${{ matrix.python-version }}.xml \
            --cov-report=term-missing \
            -v --tb=short

      - name: Run dbt tests
        env:
          DBT_TARGET: ci
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_ENDPOINT_URL: http://localhost:4566
        run: |
          cd code/transformation
          dbt deps
          dbt seed --target ci
          dbt run --target ci --select tag:unit_test
          dbt test --target ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: reports/
          retention-days: 14

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: PySpark Tests (Python ${{ matrix.python-version }})
          path: reports/pyspark-results-${{ matrix.python-version }}.xml
          reporter: java-junit

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: reports/coverage-${{ matrix.python-version }}.xml
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Security Scan: Secrets detection and IaC security analysis
  # ─────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan (${{ matrix.scanner }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scanner: [gitleaks, checkov]
        include:
          - scanner: gitleaks
            version: "8.18.4"
          - scanner: checkov
            version: "3.2.0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        if: matrix.scanner == 'gitleaks'
        uses: gitleaks/gitleaks-action@v2
        with:
          version: ${{ matrix.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Set up Python (for Checkov)
        if: matrix.scanner == 'checkov'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Run Checkov
        if: matrix.scanner == 'checkov'
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,reports/checkov-results.sarif
          soft_fail: false
          skip_check: CKV_AWS_144,CKV_AWS_145
          config_file: .checkov.yml

      - name: Upload SARIF results
        if: matrix.scanner == 'checkov' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/checkov-results.sarif

  # ─────────────────────────────────────────────────────────────────────────────
  # Build: Package Spark jobs and dbt artifacts
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: [lint, unit-test, security-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Install build dependencies
        run: |
          pip install --upgrade pip build wheel
          pip install -r requirements-dev.txt

      - name: Package Spark jobs
        run: |
          mkdir -p dist/spark-jobs
          # Package ingestion jobs
          cd code/ingestion
          python -m build --wheel --outdir ../../dist/spark-jobs/
          cd ../..
          # Package transformation utilities
          cd code/transformation
          python -m build --wheel --outdir ../../dist/spark-jobs/
          cd ../..

      - name: Package DAGs
        run: |
          mkdir -p dist/dags
          cp -r code/orchestration/dags/ dist/dags/
          # Validate DAG syntax
          python -c "
          import ast, sys, pathlib
          errors = []
          for f in pathlib.Path('dist/dags').rglob('*.py'):
              try:
                  ast.parse(f.read_text())
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('All DAGs parsed successfully')
          "

      - name: Compile dbt project
        run: |
          cd code/transformation
          dbt deps
          dbt compile --target ci
          mkdir -p ../../dist/dbt
          cp -r target/ ../../dist/dbt/

      - name: Generate build metadata
        run: |
          cat > dist/build-metadata.json << EOF
          {
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.head_ref || github.ref_name }}",
            "build_number": "${{ github.run_number }}",
            "build_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "triggered_by": "${{ github.actor }}",
            "python_version": "${{ env.PYTHON_DEFAULT }}",
            "spark_version": "${{ env.SPARK_VERSION }}"
          }
          EOF

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: atlas-build-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Status Check: Final gate for branch protection
  # ─────────────────────────────────────────────────────────────────────────────
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, unit-test, security-scan, build]
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.unit-test.result }}" != "success" ]] || \
             [[ "${{ needs.security-scan.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed successfully"
